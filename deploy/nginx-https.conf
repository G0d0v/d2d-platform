server {
  listen 80;
  listen [::]:80;
  server_name d2d.darkgpt.cfd;
  location /.well-known/acme-challenge/ { root /var/www/d2d-acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name d2d.darkgpt.cfd;
  ssl_certificate /etc/letsencrypt/live/d2d.darkgpt.cfd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/d2d.darkgpt.cfd/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 0;
  client_body_timeout 300s;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:19090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
